name: Update pinned stl2step engine

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-engine:
    runs-on: windows-latest
    steps:
      - name: Check out FreeCAD add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Check latest upstream engine manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only platforms the add-on can download and unpack (ZIP archives).
          # Upstream also publishes e.g. macos-arm64 (.tar.gz) and web-wasm.
          $supported = @('windows-x64')
          $release = gh api repos/BlinkingSun/stl2step/releases/latest | ConvertFrom-Json
          $manifestAsset = $release.assets | Where-Object name -eq 'engine-manifest.json' | Select-Object -First 1
          if (-not $manifestAsset) { throw "No engine-manifest.json found in $($release.tag_name)" }
          gh release download $release.tag_name --repo BlinkingSun/stl2step --pattern 'engine-manifest.json' --dir $env:RUNNER_TEMP --clobber
          $manifest = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'engine-manifest.json') | ConvertFrom-Json
          $windows = $manifest.assets.'windows-x64'
          if (-not $windows) { throw "Manifest has no windows-x64 entry" }
          $pinPath = Join-Path $env:GITHUB_WORKSPACE 'freecad\stl2step\engine-release.json'
          $config = Get-Content -Raw $pinPath | ConvertFrom-Json
          if ($config.tag -eq $release.tag_name -and $config.assets.'windows-x64'.sha256 -eq $windows.sha256) { exit 0 }
          $assets = [ordered]@{}
          foreach ($entry in $manifest.assets.PSObject.Properties) {
            if ($supported -notcontains $entry.Name) { continue }
            $assets[$entry.Name] = [ordered]@{ name=$entry.Value.name; sha256=$entry.Value.sha256; size=$entry.Value.size }
          }
          [ordered]@{ upstreamRepository='BlinkingSun/stl2step'; tag=$release.tag_name; engineVersion=$manifest.engineVersion; assets=$assets } |
            ConvertTo-Json -Depth 5 | Set-Content $pinPath
          "UPSTREAM_TAG=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ENGINE_VERSION=$($manifest.engineVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: develop
          commit-message: "Pin stl2step engine ${{ env.ENGINE_VERSION }}"
          title: "Pin stl2step engine ${{ env.ENGINE_VERSION }}"
          body: |
            Weekly check against the canonical upstream `BlinkingSun/stl2step` release found a newer engine.

            Upstream release: `${{ env.UPSTREAM_TAG }}`
            Engine version: `${{ env.ENGINE_VERSION }}`

            This only updates the pin in `freecad/stl2step/engine-release.json`. Users get the new engine
            after the next release: Addon Manager and git installs are prompted to download it, and the
            release ZIP bundles it.

            CI does not run on this pull request automatically, because it was opened with the workflow
            token. Merging it runs the Tests workflow on `develop`, which downloads this engine and checks
            its size, SHA-256 and version. To check before merging, run `scripts/vendor-engine.ps1` locally.
          branch: automation/update-engine
          delete-branch: true
