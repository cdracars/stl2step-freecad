name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run engine adapter tests
        run: python -m unittest discover -s tests

      - name: Run Python syntax checks
        shell: pwsh
        run: |
          python -m py_compile `
            Stl2StepFreeCAD\Init.py `
            Stl2StepFreeCAD\InitGui.py `
            Stl2StepFreeCAD\stl2step_freecad\command.py `
            Stl2StepFreeCAD\stl2step_freecad\engine.py

      - name: Vendor pinned upstream engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\vendor-engine.ps1
